name: Autonomous merge
on:
  workflow_run:
    workflows: ["Hardening quality checks"]
    types: [completed]
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  guarded-merge:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge authorized PR after independent approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for pr in $(gh api "repos/$GH_REPO/commits/$RUN_SHA/pulls" --jq '.[] | select(.state=="open") | .number'); do
            gh api "repos/$GH_REPO/pulls/$pr" > pr.json
            jq -e --arg sha "$RUN_SHA" '
              .state=="open" and (.draft|not) and .base.ref=="main" and
              .head.sha==$sha and .head.repo.full_name==.base.repo.full_name and
              (.body // "" | test("(?m)^Autonomy-Release: true$"))
            ' pr.json >/dev/null || continue
            # Reviews may arrive after CI, so both event paths recheck a successful PR run on this exact HEAD.
            successful=$(gh api "repos/$GH_REPO/actions/workflows/quality.yml/runs?head_sha=$RUN_SHA&event=pull_request&per_page=50" --jq '[.workflow_runs[] | select(.conclusion=="success" and .head_sha=="'$RUN_SHA'")] | length')
            if [[ "$successful" -lt 1 ]]; then
              echo "No successful PR quality run for exact HEAD $RUN_SHA"
              continue
            fi
            author=$(jq -r '.user.login' pr.json)
            gh api "repos/$GH_REPO/pulls/$pr/reviews?per_page=100" > reviews.json
            jq -e --arg sha "$RUN_SHA" --arg author "$author" '
              (any(.[]; .state=="APPROVED" and .commit_id==$sha and .user.login!=$author)) and
              (all(.[]; .state!="CHANGES_REQUESTED"))
            ' reviews.json >/dev/null || continue
            # Explicit dispatch is required: a GITHUB_TOKEN merge does not trigger push workflows.
            merged=$(gh api -X PUT "repos/$GH_REPO/pulls/$pr/merge" -f merge_method=squash -f sha="$RUN_SHA" --jq '.merged')
            if [[ "$merged" == "true" ]]; then
              gh workflow run "Deploy static content to Pages" --ref main
            fi
          done
