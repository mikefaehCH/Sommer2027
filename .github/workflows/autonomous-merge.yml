name: Autonomous merge
# Routine releases without per-step approval (RELEASE_POLICY.md):
# opt-in line + routine paths only + every CI check green on the exact HEAD.
# Claude reviews are visible but non-blocking and are not GitHub approvals.
# Workflows, agent/release rules, SQL/Supabase, dependencies, vendor code and
# security configuration never merge here; they need Mike's explicit merge.
on:
  workflow_run:
    workflows: ["Hardening quality checks"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write
concurrency:
  group: autonomous-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  guarded-merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge authorized routine change after all checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUIRED_WORKFLOWS: "quality.yml"
        shell: bash
        run: |
          set -euo pipefail
          # Paths that are never "routine": the release gate itself, agent and release
          # rules, database/Supabase code, dependencies, vendored code, security config
          # and photo-approval data.
          PROTECTED='^(\.github/|supabase/|vendor/|starter/backend/)|^(AGENTS|CLAUDE|ENGINEERING|RELEASE_POLICY|AI_SETUP|HARDENING_REPORT)\.md$|^docs/(RELEASE_POLICY|CAMINO_PROJECT_RULES|AI_COLLABORATION)\.md$|^(package\.json|package-lock\.json|\.npmrc|CSP\.json|DEPENDENCIES\.json|PHOTOS\.json|ACTIVITY_PHOTOS\.json|PHOTO_RESEARCH\.json)$'
          for pr in $(gh api "repos/$GH_REPO/commits/$RUN_SHA/pulls" --jq '.[] | select(.state=="open") | .number'); do
            gh api "repos/$GH_REPO/pulls/$pr" > pr.json
            jq -e --arg sha "$RUN_SHA" '
              .state=="open" and (.draft|not) and .base.ref=="main" and
              .head.sha==$sha and .head.repo.full_name==.base.repo.full_name and
              (.body // "" | test("(?m)^Autonomy-Release: true$"))
            ' pr.json >/dev/null || { echo "PR #$pr: no authorized opt-in on exact HEAD"; continue; }

            # 1. Routine scope: only added/modified files outside protected paths.
            gh api --paginate "repos/$GH_REPO/pulls/$pr/files?per_page=100" \
              --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv' > files.tsv
            files=$(grep -c . files.tsv || true)
            if [[ "$files" -eq 0 || "$files" -ge 3000 ]]; then echo "PR #$pr: file list empty or truncated"; continue; fi
            if awk -F'\t' '$1!="modified" && $1!="added"' files.tsv | grep -q .; then
              echo "PR #$pr: removed/renamed files need Mike's merge decision"; continue
            fi
            if cut -f2,3 files.tsv | tr '\t' '\n' | grep -E "$PROTECTED"; then
              echo "PR #$pr: protected paths need Mike's merge decision"; continue
            fi

            # 2. Each required workflow succeeded as a pull_request run on this exact HEAD.
            ok=1
            for wf in $REQUIRED_WORKFLOWS; do
              n=$(gh api "repos/$GH_REPO/actions/workflows/$wf/runs?head_sha=$RUN_SHA&event=pull_request&per_page=20" \
                | jq --arg sha "$RUN_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .conclusion=="success")] | length')
              [[ "$n" -ge 1 ]] || { echo "PR #$pr: $wf not yet successful on $RUN_SHA"; ok=0; }
            done
            [[ "$ok" -eq 1 ]] || continue

            # 3. Every other check on this HEAD is finished and green (no pending, no failure).
            #    Only the Claude review check is excluded: it is advisory, never a merge switch.
            gh api --paginate "repos/$GH_REPO/commits/$RUN_SHA/check-runs?per_page=100" --jq '.check_runs[]' | jq -s '.' > checks.json
            jq -e '
              [.[] | select(.name != "Claude review" and .name != "Review (trusted runner)")] |
              length > 0 and all(.status=="completed" and (.conclusion=="success" or .conclusion=="neutral" or .conclusion=="skipped"))
            ' checks.json >/dev/null || { echo "PR #$pr: checks pending or not green; a later CI completion re-evaluates"; continue; }
            gh api "repos/$GH_REPO/commits/$RUN_SHA/status" > status.json
            jq -e '.total_count == 0 or .state == "success"' status.json >/dev/null || { echo "PR #$pr: commit status not green"; continue; }

            # 4. No reviewer's latest review requests changes (a human brake stays effective).
            gh api --paginate "repos/$GH_REPO/pulls/$pr/reviews?per_page=100" --jq '.[]' | jq -s '.' > reviews.json
            jq -e '[.[] | select(.state=="APPROVED" or .state=="CHANGES_REQUESTED" or .state=="DISMISSED")] |
              group_by(.user.login) | map(max_by(.submitted_at)) | all(.state != "CHANGES_REQUESTED")' reviews.json >/dev/null \
              || { echo "PR #$pr: changes requested"; continue; }

            # Server-side merge with SHA lock; no checkout of PR code. Branch protection still applies.
            merged=$(gh api -X PUT "repos/$GH_REPO/pulls/$pr/merge" -f merge_method=squash -f sha="$RUN_SHA" --jq '.merged') \
              || { echo "PR #$pr: merge rejected by GitHub"; continue; }
            if [[ "$merged" == "true" ]]; then
              echo "PR #$pr merged at $RUN_SHA"
              # A GITHUB_TOKEN merge does not trigger push workflows, so release explicitly.
              gh workflow run "Deploy static content to Pages" --ref main
            fi
          done
