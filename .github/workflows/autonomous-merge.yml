name: Autonomous merge
on:
  workflow_run:
    workflows: ["Hardening quality checks"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  guarded-merge:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge authorized PR after independent approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for pr in $(gh api "repos/$GH_REPO/commits/$RUN_SHA/pulls" --jq '.[] | select(.state=="open") | .number'); do
            gh api "repos/$GH_REPO/pulls/$pr" > pr.json
            jq -e --arg sha "$RUN_SHA" '
              .state=="open" and (.draft|not) and .base.ref=="main" and
              .head.sha==$sha and .head.repo.full_name==.base.repo.full_name and
              (.body // "" | test("(?m)^Autonomy-Release: true$"))
            ' pr.json >/dev/null || continue
            author=$(jq -r '.user.login' pr.json)
            gh api "repos/$GH_REPO/pulls/$pr/reviews?per_page=100" > reviews.json
            jq -e --arg sha "$RUN_SHA" --arg author "$author" '
              (any(.[]; .state=="APPROVED" and .commit_id==$sha and .user.login!=$author)) and
              (all(.[]; .state!="CHANGES_REQUESTED"))
            ' reviews.json >/dev/null || continue
            gh api -X PUT "repos/$GH_REPO/pulls/$pr/merge" -f merge_method=squash -f sha="$RUN_SHA"
          done
