name: Hardening quality checks
on:
  push:
    branches: [chore/sommer2027-hardening, fix/edge-request-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        viewport: [desktop, mobile, se]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run verify:sri
      - name: Install browser and system dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_VIEWPORT: ${{ matrix.viewport }}
