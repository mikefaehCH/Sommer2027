name: Hardening quality checks
on:
  push:
    branches: [chore/sommer2027-hardening, fix/edge-request-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        viewport: [desktop, mobile, se]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Temporary formatter diagnostics
        run: |
          npx prettier --write starter/admin/index.html starter/admin/site-schema.js starter/admin/wizard.css starter/admin/wizard.js starter/tests/admin-schema.mjs
          for f in starter/admin/index.html starter/admin/site-schema.js starter/admin/wizard.css starter/admin/wizard.js starter/tests/admin-schema.mjs; do
            echo "FORMAT_FILE:$f:$(base64 -w0 "$f")"
          done
      - run: npm run format:check
      - run: npm run check
      - run: npm run verify:sri
      - name: Install browser and system dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_VIEWPORT: ${{ matrix.viewport }}
