name: Hardening quality checks
on:
  push:
    branches: [chore/sommer2027-hardening, fix/edge-request-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        viewport: [desktop, mobile, se]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run verify:sri
      - name: Install browser and system dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_VIEWPORT: ${{ matrix.viewport }}
