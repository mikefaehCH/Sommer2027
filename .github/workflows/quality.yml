name: Hardening quality checks
on:
  push:
    branches: [chore/sommer2027-hardening, fix/edge-request-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        viewport: [desktop, mobile, se]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Diagnose Prettier HTML output
        run: node -e "const p=require('prettier');const fs=require('fs');(async()=>{const f='starter/admin/index.html';const opts=await p.resolveConfig(f);const out=await p.format(fs.readFileSync(f,'utf8'),{...opts,filepath:f});console.log('FORMATTED_HTML_BASE64='+Buffer.from(out).toString('base64'))})()"
      - run: npm run format:check
      - run: npm run check
      - run: npm run verify:sri
      - name: Install browser and system dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_VIEWPORT: ${{ matrix.viewport }}
